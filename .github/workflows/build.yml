name: build-windows-exe

# Runs the internal conversion test, checks the PowerShell scripts parse, then
# builds a standalone, self-contained Windows executable and uploads it as a
# downloadable artifact. No .NET installation is needed to run the .exe.

on:
  push:
    branches:
      - claude/pbip-conversion-utility-erg8f
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run internal conversion test
        run: python tests/internal_test.py

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in 'powershell/bim-to-pbip.ps1', 'powershell/Fix-PbipBom.ps1') {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $script, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $failed = $true
                  $errors | ForEach-Object { Write-Error "$script : $_" }
              }
              else { Write-Host "OK  $script" }
          }
          if ($failed) { exit 1 }

  publish:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish BimToPbipCli
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BimToPbipCli-win-x64
          path: publish/BimToPbipCli.exe
          if-no-files-found: error
