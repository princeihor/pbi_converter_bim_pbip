name: build-windows-exe

# Builds the converter, runs the internal end-to-end conversion test against the
# real built tool, then builds a standalone, self-contained Windows executable
# and uploads it as a downloadable artifact. No .NET installation is needed to
# run the published .exe.

on:
  push:
    branches:
      - claude/pbip-conversion-utility-erg8f
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the converter
        run: dotnet build BimToPbipCli -c Release

      - name: Run internal conversion test
        run: python tests/internal_test.py

  publish:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish BimToPbipCli
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BimToPbipCli-win-x64
          path: publish/BimToPbipCli.exe
          if-no-files-found: error
