name: build-windows-exe

# Builds a standalone, self-contained Windows executable and uploads it as a
# downloadable artifact. Download it from the run's "Artifacts" section — no
# .NET installation is needed on the machine that runs the .exe.

on:
  push:
    branches:
      - claude/pbip-conversion-utility-erg8f
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish BimToPbipCli
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BimToPbipCli-win-x64
          path: publish/BimToPbipCli.exe
          if-no-files-found: error
